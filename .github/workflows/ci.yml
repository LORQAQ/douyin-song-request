name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试（Node ${{ matrix.node }} / ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 语法检查（全部 JS）
        shell: bash
        run: |
          set -e
          find src scripts test -name '*.js' -print0 | xargs -0 -n1 node --check
          echo "语法检查通过"

      - name: 跑测试套件
        run: npm test

      - name: 压力测试
        run: npm run test:stress
